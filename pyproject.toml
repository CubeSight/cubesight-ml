[project]
name = "cubesight-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "QnK1", email = "dlubalakacper@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fvcore>=0.1.5.post20221221",
    "ipykernel>=7.2.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "scipy>=1.18.1",
    "tensorboard>=2.20.0",
    "torch>=2.5.1",
    "tqdm>=4.67.3",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[project.scripts]
cubesight-ml = "cubesight_ml:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "C4",
    "SIM",
    "RET",
    "BLE",
    "TC",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: long-running training smoke tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.9",
]
