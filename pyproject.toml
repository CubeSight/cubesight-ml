[project]
name = "cubesight-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "QnK1", email = "dlubalakacper@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
]

[project.scripts]
cubesight-ml = "cubesight_ml:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
# Strict adherence to the 80-character limit
line-length = 80
target-version = "py312"

[tool.ruff.lint]
# Enable absolutely every rule Ruff knows about
select = ["ALL"]

ignore = [
    "D1",      # missing docstrings
    "D203",    # one-blank-line-before-class (Conflicts with D211)
    "D213",    # multi-line-summary-second-line (Conflicts with D212)
    "COM812",  # missing-trailing-comma (Conflicts with the formatter)
    "ISC001",  # single-line-implicit-string-concatenation (Conflicts with the formatter)
    "ANN101",  # missing-type-self (Deprecated; ty/mypy infer this automatically)
    "ANN102",  # missing-type-cls (Deprecated; same as above)
    "FIX002",  # line-contains-todo (Too aggressive for active development)
    "TD002",   # missing-todo-author (Overhead for solo/small projects)
    "TD003",   # missing-todo-link (Overhead for solo/small projects)
    "ERA001",  # found-commented-out-code (Annoying during ML experimentation)
    "INP001",  # implicit-namespace-package (Triggers on scripts outside of src/)
]

[tool.ruff.lint.per-file-ignores]
# Training scripts and notebooks often use "assert" for shape checking
# and aren't intended as public APIs, so we can relax docstring/annotation rules.
# for example: "train.py" = ["S101", "D", "ANN"]
# for example: "tests/*" = ["S101", "D", "ANN"]

[tool.ty]
# "strict" is the equivalent of "mypy --strict".
# It enforces:
# - No untyped function definitions
# - No implicit Any (from unannotated variables)
# - No missing return type hints
type-checking-mode = "strict"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
